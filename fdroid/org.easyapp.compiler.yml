License: GPL-3.0-or-later
AuthorName: AlexeyNaverno
SourceCode: https://github.com/AlexeyNaverno/EasyAnyHtmlUIProgramm
IssueTracker: https://github.com/AlexeyNaverno/EasyAnyHtmlUIProgramm/issues

AutoName: EasyApp Compiler
Summary: Compile HTML/ZIP bundles into native apps
Description: |
  Компилятор, который превращает один .html файл или .zip архив в нативное
  приложение. Права (доступ в интернет, работа с файлами устройства)
  объявляются комментариями в HTML и включаются галочками.

  Приложение работает офлайн. Всё собирается из исходников, без проприетарных
  блобов и без сервисов Google. Рантайм использует только Android SDK.

RepoType: git
Repo: https://github.com/AlexeyNaverno/EasyAnyHtmlUIProgramm.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0-rc.1
    subdir: templates/runtime-android
    sudo:
      - apt-get update
      - apt-get install -y npm zip
    init:
      - cd ../..
      - npm install --no-audit --no-fund
    # Generate the web assets from the JavaScript sources and write them into
    # the Gradle project together with the compiler's identity/permissions.
    prebuild:
      - cd ../..
      - node scripts/prepare-fdroid.mjs
    gradle:
      - yes
    # gradle.properties and assets/www are generated by prepare-fdroid.mjs
    scandelete:
      - node_modules
      - build

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
