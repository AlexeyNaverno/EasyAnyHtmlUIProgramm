# Tagged release: builds every artefact from source and publishes them together.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            target: windows-x64
            pattern: '*.exe'
          - name: windows-x86
            target: windows-x86
            pattern: '*.exe'
          - name: windows-portable
            target: windows-portable-x64
            pattern: '*.zip'
          - name: linux-x64
            target: linux-x64
            pattern: '*.zip'
          - name: android-apk
            target: android-apk
            pattern: '*.apk'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci || npm install

      - name: Install Zig
        if: startsWith(matrix.name, 'windows')
        run: pip install ziglang==0.13.0

      - name: Install WebKitGTK
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-java@v5
        if: matrix.name == 'android-apk'
        with:
          distribution: temurin
          java-version: '17'
        if: matrix.name == 'android-apk'
      - name: Verify the preinstalled Android SDK
        if: matrix.name == 'android-apk'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" || sdkmanager "platforms;android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" || sdkmanager "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.name == 'android-apk'
        with:
          gradle-version: '8.7'
      - name: Generate the Gradle wrapper from source
        if: matrix.name == 'android-apk'
        run: node scripts/setup-gradle-wrapper.mjs templates/runtime-android

      - name: Build the standalone UI (needed by the UI tests)
        run: node scripts/build-ui.mjs --assets-only
      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Build examples
        run: |
          (cd examples/files-and-net && zip -qr ../../files-and-net.zip .)
          node scripts/ci-run.mjs -- node apps/cli/src/index.mjs build examples/hello/index.html -t ${{ matrix.target }} -o release
          node scripts/ci-run.mjs -- node apps/cli/src/index.mjs build files-and-net.zip -t ${{ matrix.target }} -o release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/${{ matrix.pattern }}

  compiler:
    name: Compiler binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" || sdkmanager "platforms;android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" || sdkmanager "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: npm ci || npm install
      - name: Install Zig (cross-compiles the Windows hosts)
        run: pip install ziglang==0.13.0 || pip install --break-system-packages ziglang==0.13.0
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: node scripts/setup-gradle-wrapper.mjs templates/runtime-android
      - name: Self-host the compiler
        run: |
          node scripts/ci-run.mjs -- node scripts/build-ui.mjs windows-x64 windows-x86 windows-portable-x64 linux-x64 android-apk source-project
      - uses: actions/upload-artifact@v4
        with:
          name: release-compiler
          path: |
            dist/compiler/*.exe
            dist/compiler/*.zip
            dist/compiler/*.apk

  publish:
    name: Publish release
    needs: [build, compiler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd artefacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artefacts/*
          body: |
            Все артефакты собраны из исходников этим workflow.

            ## Компилятор
            - `EasyApp_Compiler-setup-x64.exe` / `-x86.exe` — установщики компилятора для Windows
            - `EasyApp_Compiler-windows-x64-portable.zip` — portable-версия
            - `EasyApp_Compiler.apk` — компилятор для Android
            - `EasyApp_Compiler-source.zip` — исходники

            ## Примеры приложений
            - `Hello_EasyApp-*` — минимальный пример без прав
            - `Files_and_Net_Demo-*` — пример с правами `files` и `internet`

            ## Требования к запуску
            - Windows: Microsoft Edge WebView2 Runtime (предустановлен в Windows 11)
            - Linux: `libwebkit2gtk-4.1-0`, `libgtk-3-0`
            - Android: 7.0+ (API 24)

            Проверьте целостность: `sha256sum -c SHA256SUMS.txt`
