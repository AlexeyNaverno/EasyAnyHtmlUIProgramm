# Tagged release: builds every artefact from source and publishes them together.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0-rc.1)'
        required: true
      prerelease:
        description: 'Mark as a prerelease'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            target: windows-x64
            pattern: '*.exe'
          - name: windows-x86
            target: windows-x86
            pattern: '*.exe'
          - name: windows-portable
            target: windows-portable-x64
            pattern: '*.zip'
          - name: linux-x64
            target: linux-x64
            pattern: '*.zip'
          - name: android-apk
            target: android-apk
            pattern: '*.apk'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci || npm install

      - name: Install Zig
        if: startsWith(matrix.name, 'windows')
        run: pip install ziglang==0.13.0 || pip install --break-system-packages ziglang==0.13.0

      - name: Install WebKitGTK
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-java@v5
        if: matrix.name == 'android-apk'
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the preinstalled Android SDK
        if: matrix.name == 'android-apk'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" || sdkmanager "platforms;android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" || sdkmanager "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.name == 'android-apk'
        with:
          gradle-version: '8.7'
      - name: Generate the Gradle wrapper from source
        if: matrix.name == 'android-apk'
        run: node scripts/setup-gradle-wrapper.mjs templates/runtime-android

      - name: Build the standalone UI (needed by the UI tests)
        run: node scripts/build-ui.mjs --assets-only
      - name: Run tests
        run: node scripts/ci-run.mjs -- node --test tests/*.test.mjs

      - name: Build examples
        run: |
          (cd examples/files-and-net && zip -qr ../../files-and-net.zip .)
          node scripts/ci-run.mjs -- node apps/cli/src/index.mjs build examples/hello/index.html -t ${{ matrix.target }} -o release
          node scripts/ci-run.mjs -- node apps/cli/src/index.mjs build files-and-net.zip -t ${{ matrix.target }} -o release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/${{ matrix.pattern }}

  compiler:
    name: Compiler binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" || sdkmanager "platforms;android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" || sdkmanager "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: npm ci || npm install
      - name: Install Zig (cross-compiles the Windows hosts)
        run: pip install ziglang==0.13.0 || pip install --break-system-packages ziglang==0.13.0
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: node scripts/setup-gradle-wrapper.mjs templates/runtime-android
      - name: Build the generic runtimes from source
        run: node scripts/ci-run.mjs -- node scripts/build-runtimes.mjs --strict
      - name: Self-host the compiler
        run: |
          node scripts/ci-run.mjs -- node scripts/build-ui.mjs --strict windows-x64 windows-x86 windows-portable-x64 linux-x64 android-apk source-project
      - uses: actions/upload-artifact@v4
        with:
          name: release-compiler
          path: |
            dist/compiler/*.exe
            dist/compiler/*.zip
            dist/compiler/*.apk

  publish:
    name: Publish release
    needs: [build, compiler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd artefacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Decide release kind
        id: kind
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: |
          # A semver prerelease part (v0.1.0-rc.1) marks the release as a
          # prerelease; a manual run can also force it.
          if [ "$FORCE" = "true" ] || printf '%s' "$TAG" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a prerelease"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $TAG as a stable release"
          fi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # Prereleases must never become the "latest" release.
          make_latest: false
          files: |
            artefacts/*
          body: |
            ${{ steps.kind.outputs.prerelease == 'true' && '> **Пререлиз.** Собран для проверки; интерфейс и формат артефактов ещё могут меняться.' || '' }}

            Все артефакты собраны из исходников этим workflow. Бинарных блобов
            в репозитории нет.

            ## Компилятор собирает на самом устройстве

            В каждую сборку компилятора встроены универсальные рантаймы, поэтому
            он доводит сборку до конца там, где запущен: `.apk` на телефоне,
            `.exe` и Linux-пакет на ПК — без интернета и без тулчейна на устройстве.
            Нативный код не зависит от вашего HTML, поэтому Zig, JDK и Android SDK
            нужны один раз при сборке самого компилятора. Дополнительных требований
            к ОЗУ нет.

            ## Файлы

            | Файл | Что это |
            |---|---|
            | `EasyApp_Compiler-setup-x64.exe` / `-x86.exe` | установщики для Windows |
            | `EasyApp_Compiler-windows-x64-portable.zip` | portable-версия |
            | `EasyApp_Compiler-linux-x64.zip` | Linux, внутри `install.sh` |
            | `EasyApp_Compiler.apk` | Android, собирает APK на телефоне |
            | `EasyApp_Compiler-source.zip` | исходники релиза |
            | `Hello_EasyApp-*` | пример без прав, все платформы |
            | `Files_and_Net_Demo-*` | пример с правами `files` и `internet` |

            ## Как проверено

            - Автотесты ядра, упаковки и интерфейса, включая сборку на устройстве.
            - Windows-установщики: разбор PE-заголовков и payload.
            - APK, собранный вручную на JS: `aapt2 dump badging`, `zipalign -c`
              и `apksigner verify` в CI, плюс проверка выдачи прав через `aapt2`.

            Не проверено: запуск на реальном устройстве — в CI нет ни эмулятора,
            ни дисплея. Артефакты собраны и провалидированы, первый запуск за вами.

            ## Ключ подписи Android

            Создаётся на устройстве при первой сборке и хранится в приватных файлах
            приложения (в CLI — `~/.easyapp/signing-identity.json`). Сохраните его:
            без него обновление нельзя поставить поверх старого приложения.

            ## Требования к запуску

            - Windows: Microsoft Edge WebView2 Runtime (есть в Windows 11)
            - Linux: `libwebkit2gtk-4.1-0`, `libgtk-3-0`
            - Android: 7.0+ (API 24)

            Проверьте целостность: `sha256sum -c SHA256SUMS.txt`
